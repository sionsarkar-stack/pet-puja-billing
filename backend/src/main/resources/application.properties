spring.application.name=pet-puja-billing
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pet_puja}
spring.datasource.username=${DB_USERNAME:pet_puja}
spring.datasource.password=${DB_PASSWORD:pet_puja_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Pet Puja Billing
info.app.description=Restaurant billing and management
