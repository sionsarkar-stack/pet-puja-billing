spring.application.name=pet-puja-billing
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pet_puja}
spring.datasource.username=${DB_USERNAME:pet_puja}
spring.datasource.password=${DB_PASSWORD:pet_puja_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.auth.admin.username=${ADMIN_USERNAME:}
app.auth.admin.password=${ADMIN_PASSWORD:}
app.auth.captain.username=${CAPTAIN_USERNAME:}
app.auth.captain.password=${CAPTAIN_PASSWORD:}
app.restaurant.name=${RESTAURANT_NAME:Restaurant}
app.payment.upi-vpa=${UPI_VPA:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${RESTAURANT_NAME:Restaurant}
info.app.description=Restaurant billing and management
